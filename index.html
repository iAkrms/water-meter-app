<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تقرير استهلاك المياه والصرف</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      margin: 0;
      padding: 14px;
      color: #222;
      direction: rtl;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1, h2 {
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      margin-top: 25px;
    }

    .section, .apartment-card, .report-card {
      background: white;
      padding: 15px;
      margin-bottom: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 9px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      text-align: right;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #0069d9;
      color: white;
    }

    .success {
      background: #28a745;
      color: white;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    .summary {
      background: #f7f9fb;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      line-height: 1.7;
    }

    .report-card {
      border-right: 5px solid #0069d9;
    }

    .report-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #0069d9;
    }

    .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      gap: 10px;
    }

    .row span:first-child {
      font-weight: bold;
      color: #555;
    }

    .row span:last-child {
      text-align: left;
    }

    .grand-total {
      background: #222;
      color: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      font-size: 18px;
      margin-top: 15px;
    }

    small {
      color: #666;
      line-height: 1.6;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>تقرير استهلاك المياه والصرف</h1>

  <div class="section">
    <h2>فترة الفاتورة</h2>

    <label>تاريخ البداية</label>
    <input type="date" id="startDate">

    <label>تاريخ النهاية</label>
    <input type="date" id="endDate">
  </div>

  <div class="section">
    <h2>إجمالي المصاريف الشهرية</h2>

    <label>إجمالي مبلغ المياه المدفوع (ريال)</label>
    <input type="number" id="totalWaterCost" placeholder="مثال: 800">

    <label>إجمالي مبلغ الصرف المدفوع (ريال)</label>
    <input type="number" id="totalSewageCost" placeholder="مثال: 300">
  </div>

  <h2>قراءات الشقق</h2>

  <div id="apartments"></div>

  <button class="primary" onclick="calculateReports()">
    إنشاء التقارير
  </button>

  <button class="success" onclick="saveCurrentData()">
    حفظ القراءات الحالية المدخلة
  </button>

  <button class="danger" onclick="resetAllData()">
    مسح البيانات المحفوظة
  </button>

  <div id="reports"></div>

</div>

<script>
const APARTMENTS = 8;

const apartmentsDiv = document.getElementById("apartments");

function getSavedValue(key, defaultValue) {
  return localStorage.getItem(key) !== null
    ? localStorage.getItem(key)
    : defaultValue;
}

function money(value) {
  return `${Number(value).toFixed(2)} ريال`;
}

function liters(value) {
  return `${Number(value).toLocaleString()} لتر`;
}

for (let i = 1; i <= APARTMENTS; i++) {
  apartmentsDiv.innerHTML += `
    <div class="apartment-card">
      <h3>الشقة ${i}</h3>

      <label>القراءة السابقة</label>
      <input
        type="number"
        id="prev${i}"
        value="${getSavedValue(`apt_${i}_previous`, 0)}"
      >

      <label>القراءة الحالية</label>
      <input
        type="number"
        id="current${i}"
        placeholder="أدخل القراءة الحالية"
        value="${getSavedValue(`apt_${i}_current_draft`, "")}"
        oninput="localStorage.setItem('apt_${i}_current_draft', this.value)"
      >

      <label>المبلغ السابق غير المدفوع (ريال)</label>
      <input
        type="number"
        id="unpaid${i}"
        value="${getSavedValue(`apt_${i}_unpaid`, 0)}"
      >

      <small>
        يمكنك ترك الشقق غير المطلوبة فارغة. سيتم احتساب وحفظ الشقق التي تم إدخال قراءتها فقط.
      </small>
    </div>
  `;
}

function calculateReports() {
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;
  const totalWaterCost = Number(document.getElementById("totalWaterCost").value || 0);
  const totalSewageCost = Number(document.getElementById("totalSewageCost").value || 0);

  if (!startDate || !endDate) {
    alert("يرجى اختيار تاريخ البداية وتاريخ النهاية.");
    return;
  }

  if (new Date(endDate) < new Date(startDate)) {
    alert("تاريخ النهاية لا يمكن أن يكون قبل تاريخ البداية.");
    return;
  }

  let data = [];
  let totalConsumption = 0;

  for (let i = 1; i <= APARTMENTS; i++) {
    const previous = Number(document.getElementById(`prev${i}`).value || 0);
    const currentInput = document.getElementById(`current${i}`).value;
    const unpaid = Number(document.getElementById(`unpaid${i}`).value || 0);

    if (currentInput === "") {
      continue;
    }

    const current = Number(currentInput);

    if (current < previous) {
      alert(`الشقة ${i}: القراءة الحالية لا يمكن أن تكون أقل من القراءة السابقة.`);
      return;
    }

    const netConsumption = current - previous;
    totalConsumption += netConsumption;

    data.push({
      apartment: i,
      previous,
      current,
      netConsumption,
      unpaid
    });
  }

  if (data.length === 0) {
    alert("يرجى إدخال قراءة شقة واحدة على الأقل.");
    return;
  }

  let reportsHTML = `<h2>تقارير الشقق</h2>`;
  let grandTotal = 0;

  data.forEach(item => {
    const ratio = totalConsumption === 0
      ? 0
      : item.netConsumption / totalConsumption;

    const waterCost = totalWaterCost * ratio;
    const sewageCost = totalSewageCost * ratio;
    const totalMoney = waterCost + sewageCost + item.unpaid;

    grandTotal += totalMoney;

    reportsHTML += `
      <div class="report-card">
        <div class="report-title">
          تقرير الشقة ${item.apartment}
        </div>

        <div class="summary">
          <strong>الفترة:</strong> من ${startDate} إلى ${endDate}
        </div>

        <div class="row">
          <span>رقم الشقة</span>
          <span>${item.apartment}</span>
        </div>

        <div class="row">
          <span>القراءة السابقة</span>
          <span>${liters(item.previous)}</span>
        </div>

        <div class="row">
          <span>القراءة الحالية</span>
          <span>${liters(item.current)}</span>
        </div>

        <div class="row">
          <span>صافي الاستهلاك</span>
          <span>${liters(item.netConsumption)}</span>
        </div>

        <div class="row">
          <span>نسبة الاستهلاك</span>
          <span>${(ratio * 100).toFixed(2)}%</span>
        </div>

        <div class="row">
          <span>تكلفة المياه</span>
          <span>${money(waterCost)}</span>
        </div>

        <div class="row">
          <span>تكلفة الصرف</span>
          <span>${money(sewageCost)}</span>
        </div>

        <div class="row">
          <span>المبلغ السابق غير المدفوع</span>
          <span>${money(item.unpaid)}</span>
        </div>

        <div class="row">
          <span>الإجمالي المطلوب</span>
          <span><strong>${money(totalMoney)}</strong></span>
        </div>
      </div>
    `;
  });

  reportsHTML += `
    <div class="grand-total">
      إجمالي استهلاك المبنى: ${liters(totalConsumption)}
      <br><br>
      إجمالي المبلغ المطلوب تحصيله: ${money(grandTotal)}
    </div>
  `;

  document.getElementById("reports").innerHTML = reportsHTML;
}

function saveCurrentData() {
  let savedCount = 0;

  for (let i = 1; i <= APARTMENTS; i++) {
    const currentInput = document.getElementById(`current${i}`);
    const unpaidInput = document.getElementById(`unpaid${i}`);

    if (currentInput.value === "") {
      continue;
    }

    localStorage.setItem(`apt_${i}_previous`, Number(currentInput.value));
    localStorage.setItem(`apt_${i}_unpaid`, Number(unpaidInput.value || 0));
    localStorage.removeItem(`apt_${i}_current_draft`);

    document.getElementById(`prev${i}`).value = Number(currentInput.value);

    savedCount++;
  }

  if (savedCount === 0) {
    alert("يرجى إدخال قراءة حالية واحدة على الأقل قبل الحفظ.");
    return;
  }

  alert(`تم حفظ قراءات ${savedCount} شقة بنجاح.`);
}

function resetAllData() {
  if (!confirm("هل أنت متأكد من مسح جميع القراءات والمبالغ المحفوظة؟")) {
    return;
  }

  for (let i = 1; i <= APARTMENTS; i++) {
    localStorage.removeItem(`apt_${i}_previous`);
    localStorage.removeItem(`apt_${i}_unpaid`);
    localStorage.removeItem(`apt_${i}_current_draft`);

    document.getElementById(`prev${i}`).value = 0;
    document.getElementById(`current${i}`).value = "";
    document.getElementById(`unpaid${i}`).value = 0;
  }

  document.getElementById("reports").innerHTML = "";
}
</script>

</body>
</html>
