<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Water Meter Report</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      margin: 0;
      padding: 14px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1, h2 {
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      margin-top: 25px;
    }

    .section, .apartment-card, .report-card {
      background: white;
      padding: 15px;
      margin-bottom: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 9px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #0069d9;
      color: white;
    }

    .success {
      background: #28a745;
      color: white;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    .summary {
      background: #f7f9fb;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      line-height: 1.7;
    }

    .report-card {
      border-left: 5px solid #0069d9;
    }

    .report-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #0069d9;
    }

    .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      gap: 10px;
    }

    .row span:first-child {
      font-weight: bold;
      color: #555;
    }

    .row span:last-child {
      text-align: right;
    }

    .grand-total {
      background: #222;
      color: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      font-size: 18px;
      margin-top: 15px;
    }

    small {
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Water & Sewage Report</h1>

  <div class="section">
    <h2>Billing Period</h2>

    <label>Start Date</label>
    <input type="date" id="startDate">

    <label>End Date</label>
    <input type="date" id="endDate">
  </div>

  <div class="section">
    <h2>Total Monthly Expenses</h2>

    <label>Total Water Spent (SAR)</label>
    <input type="number" id="totalWaterCost" placeholder="Example: 800">

    <label>Total Sewage Spent (SAR)</label>
    <input type="number" id="totalSewageCost" placeholder="Example: 300">
  </div>

  <h2>Apartment Readings</h2>

  <div id="apartments"></div>

  <button class="primary" onclick="calculateReports()">
    Generate Reports
  </button>

  <button class="success" onclick="saveCurrentData()">
    Save Filled Current Readings
  </button>

  <button class="danger" onclick="resetAllData()">
    Reset Saved Data
  </button>

  <div id="reports"></div>

</div>

<script>
const APARTMENTS = 8;

const apartmentsDiv = document.getElementById("apartments");

function getSavedValue(key, defaultValue) {
  return localStorage.getItem(key) !== null
    ? localStorage.getItem(key)
    : defaultValue;
}

function money(value) {
  return `${Number(value).toFixed(2)} SAR`;
}

for (let i = 1; i <= APARTMENTS; i++) {
  apartmentsDiv.innerHTML += `
    <div class="apartment-card">
      <h3>Apartment ${i}</h3>

      <label>Previous Reading</label>
      <input
        type="number"
        id="prev${i}"
        value="${getSavedValue(`apt_${i}_previous`, 0)}"
      >

      <label>Current Reading</label>
      <input
        type="number"
        id="current${i}"
        placeholder="Enter current reading"
        value="${getSavedValue(`apt_${i}_current_draft`, "")}"
        oninput="localStorage.setItem('apt_${i}_current_draft', this.value)"
      >

      <label>Previous Unpaid Amount (SAR)</label>
      <input
        type="number"
        id="unpaid${i}"
        value="${getSavedValue(`apt_${i}_unpaid`, 0)}"
      >

      <small>
        You can leave empty apartments blank. Only filled apartments will be calculated and saved.
      </small>
    </div>
  `;
}

function calculateReports() {
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;
  const totalWaterCost = Number(document.getElementById("totalWaterCost").value || 0);
  const totalSewageCost = Number(document.getElementById("totalSewageCost").value || 0);

  if (!startDate || !endDate) {
    alert("Please select start and end dates.");
    return;
  }

  if (new Date(endDate) < new Date(startDate)) {
    alert("End date cannot be before start date.");
    return;
  }

  let data = [];
  let totalConsumption = 0;

  for (let i = 1; i <= APARTMENTS; i++) {
    const previous = Number(document.getElementById(`prev${i}`).value || 0);
    const currentInput = document.getElementById(`current${i}`).value;
    const unpaid = Number(document.getElementById(`unpaid${i}`).value || 0);

    if (currentInput === "") {
      continue;
    }

    const current = Number(currentInput);

    if (current < previous) {
      alert(`Apartment ${i}: current reading cannot be less than previous reading.`);
      return;
    }

    const netConsumption = current - previous;
    totalConsumption += netConsumption;

    data.push({
      apartment: i,
      previous,
      current,
      netConsumption,
      unpaid
    });
  }

  if (data.length === 0) {
    alert("Please enter at least one apartment reading.");
    return;
  }

  let reportsHTML = `<h2>Individual Apartment Reports</h2>`;
  let grandTotal = 0;

  data.forEach(item => {
    const ratio = totalConsumption === 0
      ? 0
      : item.netConsumption / totalConsumption;

    const waterCost = totalWaterCost * ratio;
    const sewageCost = totalSewageCost * ratio;
    const totalMoney = waterCost + sewageCost + item.unpaid;

    grandTotal += totalMoney;

    reportsHTML += `
      <div class="report-card">
        <div class="report-title">
          Apartment ${item.apartment}
        </div>

        <div class="summary">
          <strong>Period:</strong> ${startDate} to ${endDate}
        </div>

        <div class="row">
          <span>Previous Reading</span>
          <span>${item.previous}</span>
        </div>

        <div class="row">
          <span>Current Reading</span>
          <span>${item.current}</span>
        </div>

        <div class="row">
          <span>Net Consumption</span>
          <span>${item.netConsumption}</span>
        </div>

        <div class="row">
          <span>Consumption Ratio</span>
          <span>${(ratio * 100).toFixed(2)}%</span>
        </div>

        <div class="row">
          <span>Water Cost</span>
          <span>${money(waterCost)}</span>
        </div>

        <div class="row">
          <span>Sewage Cost</span>
          <span>${money(sewageCost)}</span>
        </div>

        <div class="row">
          <span>Previous Unpaid</span>
          <span>${money(item.unpaid)}</span>
        </div>

        <div class="row">
          <span>Total Amount</span>
          <span><strong>${money(totalMoney)}</strong></span>
        </div>
      </div>
    `;
  });

  reportsHTML += `
    <div class="grand-total">
      Total Building Consumption: ${totalConsumption}
      <br><br>
      Total Amount to Collect: ${money(grandTotal)}
    </div>
  `;

  document.getElementById("reports").innerHTML = reportsHTML;
}

function saveCurrentData() {
  let savedCount = 0;

  for (let i = 1; i <= APARTMENTS; i++) {
    const currentInput = document.getElementById(`current${i}`);
    const unpaidInput = document.getElementById(`unpaid${i}`);

    if (currentInput.value === "") {
      continue;
    }

    localStorage.setItem(`apt_${i}_previous`, Number(currentInput.value));
    localStorage.setItem(`apt_${i}_unpaid`, Number(unpaidInput.value || 0));
    localStorage.removeItem(`apt_${i}_current_draft`);

    document.getElementById(`prev${i}`).value = Number(currentInput.value);

    savedCount++;
  }

  if (savedCount === 0) {
    alert("Please enter at least one current reading before saving.");
    return;
  }

  alert(`${savedCount} apartment reading(s) saved successfully.`);
}

function resetAllData() {
  if (!confirm("Are you sure you want to reset all saved readings and unpaid amounts?")) {
    return;
  }

  for (let i = 1; i <= APARTMENTS; i++) {
    localStorage.removeItem(`apt_${i}_previous`);
    localStorage.removeItem(`apt_${i}_unpaid`);
    localStorage.removeItem(`apt_${i}_current_draft`);

    document.getElementById(`prev${i}`).value = 0;
    document.getElementById(`current${i}`).value = "";
    document.getElementById(`unpaid${i}`).value = 0;
  }

  document.getElementById("reports").innerHTML = "";
}
</script>

</body>
</html>
