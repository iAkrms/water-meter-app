<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bills of the month</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <div class="top-actions">
    <button type="button" class="dark" onclick="setLanguage('ar')">العربية</button>
    <button type="button" class="dark" onclick="setLanguage('en')">English</button>
  </div>

  <h1 id="mainTitle">Bills of the month</h1>

  <div class="section">
    <h2 id="periodTitle"></h2>

    <div class="grid-2">
      <div>
        <label id="startDateLabel"></label>
        <input type="date" id="startDate">
      </div>

      <div>
        <label id="endDateLabel"></label>
        <input type="date" id="endDate">
      </div>
    </div>
  </div>

  <div class="section">
    <h2 id="expensesTitle"></h2>

    <label id="waterCostLabel"></label>
    <input type="number" id="totalWaterCost" placeholder="800">

    <label id="sewageCostLabel"></label>
    <input type="number" id="totalSewageCost" placeholder="300">
  </div>

  <h2 id="readingsTitle"></h2>

  <div id="apartments"></div>

  <button type="button" class="primary" onclick="calculateReports()" id="generateBtn">
    إنشاء التقارير
  </button>

  <button type="button" class="success" onclick="saveCurrentData()" id="saveBtn">
    حفظ القراءات
  </button>

  <button type="button" class="danger" onclick="resetAllData()" id="resetBtn">
    إعادة ضبط البيانات
  </button>

  <div id="reports"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
